<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password | Academic Research Protocol</title>
    <link rel="stylesheet" href="/dist/css/adminlte.min.css">
    <script src="/pages/config.js"></script>
    <style>
        body {
            background: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .login-box {
            margin-top: 100px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0066cc 0%, #0052a5 100%);
            border: none;
        }

            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
            }

        .card {
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }

        .card-header {
            background: white;
            border-bottom: 1px solid #f0f0f0;
            padding: 1.5rem;
        }

            .card-header h3 {
                margin: 0;
                color: #0066cc;
            }

            .card-header p {
                margin: 5px 0 0;
                color: #6c757d;
            }

        .form-control {
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            padding: 12px 15px;
        }

            .form-control:focus {
                border-color: #0066cc;
                box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
            }
    </style>
</head>
<body class="hold-transition login-page">

    <div class="login-box">
        <div class="card card-outline card-primary">
            <div class="card-header text-center">
                <h3>Change Password</h3>
                <p>You must set a new password</p>
            </div>

            <div class="card-body">
                <form id="changePasswordForm">
                    <div class="input-group mb-3">
                        <input type="password" id="newPassword" class="form-control" placeholder="New Password" required>
                    </div>
                    <div class="input-group mb-3">
                        <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password" required>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary btn-block">Update Password</button>
                        </div>
                    </div>
                </form>
                <div id="message" class="alert mt-3" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const userId = localStorage.getItem('userId');

            const messageDiv = document.getElementById('message');

            if (!userId) {
                messageDiv.style.display = 'block';
                messageDiv.className = 'alert alert-danger';
                messageDiv.textContent = 'Session expired. Please login again.';
                setTimeout(() => {
                    window.location.href = '/pages/login.html';
                }, 2000);
                return;
            }

            if (newPassword !== confirmPassword) {
                messageDiv.style.display = 'block';
                messageDiv.className = 'alert alert-danger';
                messageDiv.textContent = 'Passwords do not match';
                return;
            }

            if (newPassword.length < 6) {
                messageDiv.style.display = 'block';
                messageDiv.className = 'alert alert-danger';
                messageDiv.textContent = 'Password must be at least 6 characters';
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/Auth/change-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        userId: parseInt(userId),
                        newPassword: newPassword
                    })
                });

                if (response.ok) {
                    messageDiv.style.display = 'block';
                    messageDiv.className = 'alert alert-success';
                    messageDiv.textContent = 'Password updated successfully. Please login again.';

                    // Clear old data
                    localStorage.clear();

                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/pages/login.html';
                    }, 2000);

                } else {
                    const error = await response.text();
                    messageDiv.style.display = 'block';
                    messageDiv.className = 'alert alert-danger';
                    messageDiv.textContent = error || 'Failed to update password';
                }

            } catch (error) {
                messageDiv.style.display = 'block';
                messageDiv.className = 'alert alert-danger';
                messageDiv.textContent = 'Error connecting to server';
            }
        });
    </script>

</body>
</html>

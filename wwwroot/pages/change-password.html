<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password</title>

    <link rel="stylesheet" href="/dist/css/adminlte.min.css">
</head>
<body class="hold-transition login-page">

    <div class="login-box">
        <div class="card card-outline card-primary">
            <div class="card-header text-center">
                <h3>Change Password</h3>
                <p>You must set a new password</p>
            </div>

            <div class="card-body">
                <form id="changePasswordForm">

                    <div class="input-group mb-3">
                        <input type="password" id="newPassword" class="form-control" placeholder="New Password" required>
                    </div>

                    <div class="input-group mb-3">
                        <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password" required>
                    </div>

                    <div class="row">
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary btn-block">
                                Update Password
                            </button>
                        </div>
                    </div>

                </form>

                <div id="message" class="alert mt-3" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script>
document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const userId = localStorage.getItem('userId');

    const messageDiv = document.getElementById('message');

    if (newPassword !== confirmPassword) {
        messageDiv.style.display = 'block';
        messageDiv.className = 'alert alert-danger';
        messageDiv.textContent = 'Passwords do not match';
        return;
    }

    try {
        const response = await fetch('/api/Auth/change-password', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                userId: parseInt(userId),
                newPassword: newPassword
            })
        });

        if (response.ok) {
            messageDiv.style.display = 'block';
            messageDiv.className = 'alert alert-success';
            messageDiv.textContent = 'Password updated successfully. Please login again.';

            // Clear old data
            localStorage.clear();

            // Redirect to login after 2 seconds
            setTimeout(() => {
                window.location.href = '/login.html';
            }, 2000);

        } else {
            messageDiv.style.display = 'block';
            messageDiv.className = 'alert alert-danger';
            messageDiv.textContent = 'Failed to update password';
        }

    } catch (error) {
        messageDiv.style.display = 'block';
        messageDiv.className = 'alert alert-danger';
        messageDiv.textContent = 'Error connecting to server';
    }
});
    </script>

</body>
</html>
